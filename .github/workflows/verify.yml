name: Verify release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: commander
          POSTGRES_PASSWORD: fictional-ci-password
          POSTGRES_DB: commander_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commander -d commander_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://commander:fictional-ci-password@127.0.0.1:5432/commander_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.1"}
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: ./scripts/verify.sh
